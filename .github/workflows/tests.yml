name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: sourceaware validate examples/manifest.synthetic.jsonl
      - run: sourceaware evaluate examples/predictions.synthetic.jsonl
      - run: sourceaware evaluate-factors examples/factor_predictions.synthetic.jsonl
