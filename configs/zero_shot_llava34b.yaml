experiment: zero_shot_primary
dataset:
  name: OctantFake
  version: v1.0.0
  calibration_samples: 800
  test_samples: 8000
model:
  family: LLaVA-1.6
  checkpoint: liuhaotian/llava-v1.6-34b
  language_model: NousResearch/Nous-Hermes-2-Yi-34B
  scale: 34B
  model_path: null
inference:
  strategy: separate_structured
  temperature: 0.0
  top_p: null
  num_beams: 1
  max_new_tokens: 512
  seed: 42
retrieval:
  image_provider: google_vision_web_detection
  text_provider: google_custom_search
  top_k: 3
output:
  count_invalid_as_incorrect: true
